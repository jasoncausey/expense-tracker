<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#003366"/>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>Expense Tracker</h1>
            <button id="settings-btn" class="icon-btn" aria-label="Settings">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </header>
    <main>
        <section id="add-expense-section">
            <h2>Add New Expense</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="expense-amount">Amount:</label>
                    <div class="input-with-icon">
                        <input type="number" id="expense-amount" step="0.01" placeholder="0.00" required>
                        <button type="button" id="date-toggle-btn" class="icon-btn-inline" aria-label="Set custom date">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group" id="date-input-container" style="display: none;">
                    <label for="expense-date">Date:</label>
                    <input type="date" id="expense-date">
                </div>
                <div class="form-group">
                    <label for="expense-label">Label:</label>
                    <input type="text" id="expense-label" placeholder="e.g., Groceries, Rent" required>
                </div>
                <div class="form-group" id="quick-labels">
                    <button type="button" class="quick-label-btn" data-label="Groceries">Groceries</button>
                    <button type="button" class="quick-label-btn" data-label="Pharmacy">Pharmacy</button>
                    <button type="button" class="quick-label-btn" data-label="Phone">Phone</button>
                    <button type="button" class="quick-label-btn" data-label="Cable">Cable</button>
                    <button type="button" class="quick-label-btn" data-label="Supplies">Supplies</button>
                </div>
                <button type="submit" class="btn-primary">Add Expense</button>
            </form>
        </section>

        <section id="current-expenses-section">
            <h2>Current Expenses</h2>
            <ul id="expense-list">
                <!-- Expenses will be listed here -->
            </ul>
            <div id="total-expenses-container">
                <strong>Total: <span id="total-expenses">0.00</span></strong>
            </div>
            <button id="close-period-btn" class="btn-secondary" style="width: 100%; margin-top: 1rem;">Close Period & Generate Report</button>
        </section>

        <section id="invoice-section" class="hidden">
            <h2>Expense Report</h2>
            <div id="invoice-content">
                <!-- Invoice details will be shown here -->
            </div>
            <button id="print-invoice-btn" class="btn-secondary">Print Report</button>
            <button id="back-to-main-btn" class="btn-secondary" style="margin-top: 10px;">Back to Main View</button>
        </section>

        <section id="historical-invoices-section"> <!-- Made visible as part of main view -->
            <h2>Historical Reports</h2>
            <ul id="historical-invoices-list">
                <!-- Historical invoices will be listed here -->
            </ul>
        </section>

        <section id="view-invoice-section" class="hidden">
            <h2>View Stored Report</h2>
            <div id="view-invoice-content">
                <!-- Content of a selected historical invoice -->
            </div>
            <button id="print-historical-invoice-btn" class="btn-secondary">Print This Report</button>
            <button id="back-to-main-from-view-invoice-btn" class="btn-secondary" style="margin-top: 10px;">Back to Main View</button> <!-- Changed ID and text -->
        </section>

        <section id="settings-section" class="hidden">
            <h2>Settings</h2>
            <div class="settings-option">
                <h3>Data Management</h3>
                <p>Delete all data to start fresh. This will remove all expenses and reports.</p>
                <button id="delete-all-data-btn" class="btn-danger">Delete All Data</button>
            </div>
            <button id="back-to-main-from-settings-btn" class="btn-secondary" style="margin-top: 20px; width: 100%;">Back to Main View</button>
        </section>

    </main>
    <script src="js/db.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed: ', error);
                    });
            });
        }
    </script>
</body>
</html>
